# ==========================================================================
# ARIA Digital Twin — Material Properties Database (YAML)
# ==========================================================================
# Canonical source: src/aria/digital_twin/materials/material_db.py
# This YAML mirror is provided for external tools, dashboards, and
# configuration pipelines that cannot import Python directly.
#
# Units
# -----
# density_kg_m3           kg m⁻³
# youngs_modulus_pa        Pa
# poisson_ratio            dimensionless
# yield_strength_pa        Pa
# uts_pa                   Pa
# thermal_conductivity_w_mk  W m⁻¹ K⁻¹
# specific_heat_j_kgk      J kg⁻¹ K⁻¹
# cte_per_k                K⁻¹
# emissivity               dimensionless
# melting_point_k          K
# fatigue_limit_pa         Pa
# fatigue_exponent         dimensionless (Basquin b)
# ==========================================================================

