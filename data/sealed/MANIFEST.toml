sha256     = "aa8b96d1f720709bc946cc21a5be1c595440143081489ff23fb5e9b50f10ec4c"
size_bytes = 8388
purpose    = "ARIA constitutional rule set"

# ── Sealed safety test set (F-13) ───────────────────────────────────
