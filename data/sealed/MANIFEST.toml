# ARIA sealed-content manifest.
#
# Every file in `data/sealed/` listed here. SHA-256 hashes are recomputed
# at boot (see `aria.cognitive.sealed_prompt.verify_manifest`); a single
# byte mismatch blocks startup.
#
# Updating a sealed file is a release event: regenerate this manifest,
# resign with the release-engineer key, and rebuild the boot image.
#
# Mismatch behaviour: process refuses to start, logs
# `boot.sealed_prompt.failed`, exits with non-zero status.
#
# Implements §F-1 of docs/FAILSAFE_ARCHITECTURE.md.

manifest_version = 1
created_at       = "2026-04-25"
algorithm        = "sha256"

# ── Sealed system prompt ────────────────────────────────────────────
# The behaviour rules read by the cognitive engine on every reasoning
# request. Mounted read-only in production; in-memory copy frozen via
# types.MappingProxyType after load.
[files."system_prompt.v1.txt"]
sha256     = "c3bd53bd6f5c57f2f340eb181f2c20a899b64ee382e058d2fa80e139dbdbea43"
size_bytes = 4130
purpose    = "ARIA cognitive system prompt"

# ── Sealed constitution ─────────────────────────────────────────────
# Forbidden actions, gated actions, resource ceilings, trust tiers.
# Consulted by the constitutional layer ABOVE the LLM and by
# ExecutionGuard.
