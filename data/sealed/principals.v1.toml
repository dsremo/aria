# ARIA sealed principal roster — initial ship-baked identities (F-1).
#
# Every Ed25519 public key listed here is a TRUST ROOT. A login challenge
# signed by the corresponding hardware-token private key authenticates
# the principal as the named role.
#
# Keys are 32-byte Ed25519 raw public keys, hex-encoded (64 chars).
# Private keys never live in the file system — they live in hardware
# tokens (or, in dev/test, deterministically derive from seeds in
# tests/fixtures/dev_keys.json).
#
# Mutation protocol:
#   - This file is sealed and hashed in MANIFEST.toml. To add or revoke
#     a principal at runtime, append a hash-chained record to
#     data/runtime/principals.delta.jsonl (ApprovalQueue-mediated).
#   - To rotate an initial principal's key, ship a new sealed image
#     (re-bake at maintenance ground stop) — this is intentionally hard.
#
# Implements §F-1 (sealed roster), §F-9 (principal-aware approval),
# §F-14 (two-person on captain re-election) of FAILSAFE_ARCHITECTURE.md.

manifest_version = 1
created_at       = "2026-04-25"

# ── Trust roots ────────────────────────────────────────────────────
# The HSM-equivalent root — every issuance certificate ultimately chains
# to this key. In production it is held in a hardware HSM whose private
# half never leaves the chip. In dev/test the seeded private half is in
# tests/fixtures/dev_keys.json (clearly labelled DEV ONLY).
[hsm]
ship_root_pubkey_hex = "6a69c6ad5db4cb9c28841baa205ef45a3df17aae7b29834ea13fb04a046dcd35"
description          = "Ship HSM root signing key (Ed25519)"

# Pinned ground-station public key. Every ground-uplink command must
# carry an Ed25519 signature verifying against this key plus a strict-
# monotonic counter (F-19) and a freshness window (F-4). No session
# token is issued for ground — light-time makes a session model unsound.
[ground]
mcc_pubkey_hex = "016bfcda70921386dd438502709dc09b2bb3484f00b8bcac0330603854fbeef7"
description    = "Mission Control Center pinned public key"

# ── Initial roster ─────────────────────────────────────────────────
# Each entry is a sealed certificate hash equivalent: principal_id +
# role + Ed25519 public key + lifetime. The runtime `Principal` value
# is constructed at load time from this entry.
#
# expires_at uses ISO date strings; the loader converts to UNIX seconds.
# 25-year baseline — interstellar mission profile (ESTIMATE; tune per
# mission). No published source.

[principals."captain.tau"]
role          = "captain"
display_name  = "Captain Tau"
pubkey_hex    = "e1976727fa1db8e5500545893e679d79ec5c5506239c65ec7c1001831755357d"
created_at    = "2026-04-25"
expires_at    = "2051-04-25"

