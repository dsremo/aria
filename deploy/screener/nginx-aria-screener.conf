# nginx vhost for the ARIA Conjunction Screener.
#
# Pair with `aria-screener.service` (systemd unit) listening on
# 127.0.0.1:8443.
#
# Use ``certbot --nginx -d screener.aria.example.com`` to provision
# the certificate.  Certbot rewrites this file in place.

upstream aria_screener {
    server 127.0.0.1:8443;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name screener.aria.example.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name screener.aria.example.com;

    ssl_certificate     /etc/letsencrypt/live/screener.aria.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screener.aria.example.com/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Audit CRIT-8 — full browser-isolation header set; HIGH-8 — version
    # info is never echoed; LOW-1 — /v1/healthz is HTTPS-only; MED-8 — the
    # Authorization + token headers never appear in access logs.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(), clipboard-read=(), clipboard-write=(), magnetometer=(), accelerometer=(), gyroscope=(), midi=(), serial=(), bluetooth=(), hid=(), fullscreen=(), publickey-credentials-get=(), screen-wake-lock=(), encrypted-media=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; require-trusted-types-for 'script'" always;
    server_tokens off;

    client_max_body_size 5m;
    client_body_timeout 90s;

    # Strip token headers from the access log so they never reach disk.
    log_format token_safe '$remote_addr - - [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/aria-screener.access.log token_safe;

    location = /v1/healthz {
        access_log off;
        proxy_pass http://aria_screener;
    }

    location / {
        proxy_pass http://aria_screener;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
