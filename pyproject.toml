[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aria-core"
version = "0.4.0"
description = "ARIA — Autonomous Reasoning & Integration Architecture for SpaceAi"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-ARIA-Source-Available-v1"
license-files = ["LICENSE"]
authors = [
    { name = "Ashutosh", email = "ashutosh@dsremo.com" },
]
dependencies = [
    "anthropic>=0.40",
    "asyncio-mqtt>=0.16",
    "httpx>=0.27",
    "websockets>=13.0",
    "pydantic>=2.7",
    "structlog>=24.1",
    "msgpack>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "uvloop>=0.19; sys_platform != 'win32'",
    # Integrated modules (conjunction, genastra, dsremo)
    "numpy>=1.24",
    "scipy>=1.12",
    "astropy>=6.0",
    "sgp4>=2.23",
    "scikit-learn>=1.4",
    # Digital twin / FEA
    "meshio>=5.3",
    # Web dashboard
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that simulate 100+ years or run full multi-agent scenarios (skip with -m 'not slow')",
    "noncore: marks non-core tests (social, governance, language, colonization) (skip with -m 'not noncore')",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[project.scripts]
aria = "aria.cli.main:main"
aria-dashboard = "aria.simulator.web_dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aria"]
# Includes integrated subpackages: aria.conjunction, aria.genastra, aria.dsremo
